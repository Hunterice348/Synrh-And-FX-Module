    - name: Sign Windows binary
      if: runner.os == 'Windows'
      uses: azure/trusted-signing-action@v0.3
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: https://eus.codesigning.azure.net/
        code-signing-account-name: YourAccountName
        certificate-profile-name: YourCertProfile
        files-folder: build/MySuperSynth_artefacts/Release/VST3/
        files-folder-filter: vst3
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
name: Build VST3 Plugin

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

env:
  BUILD_TYPE: Release
  PLUGIN_NAME: "BM Synth"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmake_generator: "Visual Studio 17 2022"
            artifact_name: windows-x64
            vst3_path: "MySuperSynth_artefacts/Release/VST3/BM Synth.vst3"
          - os: macos-latest
            cmake_generator: "Xcode"
            artifact_name: macos-universal
            vst3_path: "MySuperSynth_artefacts/Release/VST3/BM Synth.vst3"
          - os: ubuntu-latest
            cmake_generator: "Unix Makefiles"
            artifact_name: linux-x64
            vst3_path: "MySuperSynth_artefacts/Release/VST3/BM Synth.vst3"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          libasound2-dev \
          libjack-jackd2-dev \
          ladspa-sdk \
          libcurl4-openssl-dev \
          libfreetype6-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          libwebkit2gtk-4.0-dev \
          libglu1-mesa-dev \
          mesa-common-dev

    - name: Cache JUCE
      id: cache-juce
      uses: actions/cache@v3
      with:
        path: juce
        key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: |
          juce-${{ runner.os }}-

    - name: Clone JUCE framework
      if: steps.cache-juce.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch 7.0.9 https://github.com/juce-framework/JUCE.git juce
      shell: bash

    - name: Configure CMake
      run: |
        cmake -B build -G "${{ matrix.cmake_generator }}" -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      shell: bash

    - name: Build
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
      shell: bash

    - name: Upload VST3 artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PLUGIN_NAME }}-${{ matrix.artifact_name }}
        path: build/${{ matrix.vst3_path }}
        retention-days: 30

    - name: Upload Standalone artifact
      uses: actions/upload-artifact@v4
      if: runner.os != 'Linux'
      with:
        name: ${{ env.PLUGIN_NAME }}-Standalone-${{ matrix.artifact_name }}
        path: build/MySuperSynth_artefacts/Release/Standalone/*
        retention-days: 30

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Package for Windows
      run: |
        cd artifacts
        zip -r ../${{ env.PLUGIN_NAME }}-Windows.zip *windows-x64*
        cd ..

    - name: Package for macOS
      run: |
        cd artifacts
        zip -r ../${{ env.PLUGIN_NAME }}-macOS.zip *macos-universal*
        cd ..

    - name: Package for Linux
      run: |
        cd artifacts
        tar -czf ../${{ env.PLUGIN_NAME }}-Linux.tar.gz *linux-x64*
        cd ..

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ env.PLUGIN_NAME }}-Windows.zip
          ${{ env.PLUGIN_NAME }}-macOS.zip
          ${{ env.PLUGIN_NAME }}-Linux.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
